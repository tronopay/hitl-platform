
volumes:
  pg-data: 

services:
  
  postgres:
    # container_name: postgres
    image: postgres:18-alpine
    volumes:
      - pg-data:/var/lib/postgresql/18/docker
    env_file:
      - .env
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U postgres -d postgres'"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  app:
    # container_name: app
    build: .
    env_file:
      - .env
    ports:
      - "${HTTP_PORT}:${HTTP_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped